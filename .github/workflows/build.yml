# =====================================================================
# DSH 会话管理器 —— 双平台自动打包 + 自动发布
#
# 触发：push 标签 v*（如 v1.2.2）时：
#   1. Windows / Ubuntu 上分别打包可执行文件
#   2. 打成带平台名的 zip（DSH_SessionManager-windows.zip / -linux.zip）
#   3. 自动上传到该 tag 对应的 GitHub Release
#
# 产物会同时出现在：
#   - Actions 运行页的 Artifacts（下载用）
#   - 对应 tag 的 Release 附件（softprops/action-gh-release 自动挂载，
#     若该 tag 还没有 Release 则自动创建）
# =====================================================================

name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # 支持手动触发（仅构建，不发布）

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    env:
      DSH_BUILD_NO_VENV: '1'   # CI 已装好依赖，跳过 build_exe.py 的 venv 重跑
      PYTHONUTF8: '1'          # 强制 UTF-8，避免中文日志在 cp1252 下报错
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build exe
        run: python build_exe.py

      - name: Package Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-staging
          Copy-Item dist\DSH_SessionManager.exe release-staging\
          Compress-Archive -Path release-staging\DSH_SessionManager.exe -DestinationPath DSH_SessionManager-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH_SessionManager-windows
          path: DSH_SessionManager-windows.zip

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    env:
      DSH_BUILD_NO_VENV: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (tkinter)
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build binary
        run: python build_exe.py

      - name: Package Linux zip
        run: |
          mkdir -p release-staging
          cp dist/DSH_SessionManager release-staging/
          cd release-staging && zip ../DSH_SessionManager-linux.zip DSH_SessionManager

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH_SessionManager-linux
          path: DSH_SessionManager-linux.zip

  # 把两个 zip 挂到 tag 对应的 GitHub Release（无 Release 则自动创建）
  publish:
    name: Publish to GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List artifacts
        run: ls -la release-assets/

      - name: Attach binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/DSH_SessionManager-windows.zip
            release-assets/DSH_SessionManager-linux.zip
          generate_release_notes: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📥 下载

            | 平台 | 文件 |
            |------|------|
            | Windows | `DSH_SessionManager-windows.zip` |
            | Linux | `DSH_SessionManager-linux.zip` |

            > 由 GitHub Actions 自动构建并发布。完整说明见仓库 README。
